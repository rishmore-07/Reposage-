[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposage-backend"
version = "0.1.0"
description = "RepoSage backend API — AI-powered GitHub repository intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "python-multipart>=0.0.9",

    # ── Database ───────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "psycopg2-binary>=2.9.9",   # Sync driver for Alembic
    "alembic>=1.13.0",

    # ── Configuration & Validation ─────────────────────────────────────────────
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # ── Security ───────────────────────────────────────────────────────────────
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",

    # ── Background Workers ─────────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.1",

    # ── HTTP Client ────────────────────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Logging ────────────────────────────────────────────────────────────────
    "structlog>=24.1.0",

    # ── Utilities ──────────────────────────────────────────────────────────────
    "python-slugify>=8.0.4",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    # ── Testing ───────────────────────────────────────────────────────────────
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # AsyncClient for FastAPI testing
    "anyio>=4.4.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",

    # ── Linting & Formatting ──────────────────────────────────────────────────
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # ── Type stubs ────────────────────────────────────────────────────────────
    "types-python-jose>=3.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of `assert` (needed in tests)
    "S104",    # Possible binding to all interfaces (OK for Docker)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"scripts/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "scripts/", "tests/"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -ra"
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (requires DB)",
    "e2e: End-to-end tests",
]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/ai/*", "app/github/*"]  # Stub modules excluded

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

# Redis configuration for RepoSage
# Used as Celery broker + result backend

# ── Network ───────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

# ── Memory ────────────────────────────────────────────────────────────────────
# Maximum memory Redis will use
maxmemory 256mb

# Eviction policy: remove least recently used keys when maxmemory is reached
# allkeys-lru is appropriate for a cache + broker hybrid
maxmemory-policy allkeys-lru

# ── Persistence ───────────────────────────────────────────────────────────────
# Save snapshot every 60s if at least 100 keys changed
save 60 100

# Enable AOF (Append Only File) for durability
appendonly yes
appendfsync everysec

# ── Performance ───────────────────────────────────────────────────────────────
# Disable slow log entries below 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Timeouts ──────────────────────────────────────────────────────────────────
# Close connections after 300 seconds of inactivity
timeout 300

# TCP keepalive interval
tcp-keepalive 60
